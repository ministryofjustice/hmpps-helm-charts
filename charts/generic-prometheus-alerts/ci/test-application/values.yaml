---
generic-prometheus-alerts:
  targetApplication: "test-application"
  runbookUrl: "https://runbook.com/"
  rdsAlertsDatabases:
    cloud-platform-uuid: "test rds"
    cloud-platform-custom-uuid: "test rds with custom threshold"
  rdsAlertsConnectionThresholds:
    cloud-platform-custom-uuid: 100
  rdsAlertsFreeStorageSpaceThresholdsGiB:
    cloud-platform-custom-uuid: 1
  sqsAlertsQueueNames:
    - "queue-name"
  openSearchAlertsDomainNames:
    cloud-platform-uuid: "test-domain"
  businessHoursOnly: false
  ingress2xxEnabled: true
  sqsAlertsInactiveThreshold: 20
  sqsInactiveAlertQueueNames:
    - "queue-name"
